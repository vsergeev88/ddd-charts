<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ddd-charts — 3D charts for React</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        min-height: 100%;
      }
      html {
        color-scheme: dark;
      }
      body {
        font-family: Inter, 'Inter Fallback', system-ui, sans-serif;
        font-feature-settings: 'calt', 'kern', 'liga', 'ss03';
        background: #07080a;
        color: #cdcdcd;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select {
        font-family: inherit;
        font-feature-settings: inherit;
      }
      a {
        color: inherit;
      }
      @keyframes heroFadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes stripeDrift {
        from {
          background-position: 0% 50%;
        }
        to {
          background-position: 100% 50%;
        }
      }
      @keyframes panelFadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .hero-animate {
        animation: heroFadeIn 0.7s ease both;
      }
      .hero-animate-delay {
        animation: heroFadeIn 0.7s ease 0.12s both;
      }
      .panel-animate {
        animation: panelFadeIn 0.55s ease 0.18s both;
      }
      .hero-stripes {
        background-image:
          linear-gradient(
            118deg,
            transparent 0%,
            transparent 38%,
            rgba(255, 87, 87, 0.55) 42%,
            rgba(161, 19, 26, 0.35) 48%,
            transparent 52%,
            transparent 62%,
            rgba(255, 87, 87, 0.4) 66%,
            rgba(161, 19, 26, 0.25) 72%,
            transparent 76%,
            transparent 84%,
            rgba(255, 87, 87, 0.28) 88%,
            rgba(161, 19, 26, 0.18) 94%,
            transparent 100%
          );
        background-size: 220% 100%;
        animation: stripeDrift 14s linear infinite alternate;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
